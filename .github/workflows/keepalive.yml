name: keepalive
# GitHub turns off scheduled workflows in a public repo after 60 days with no commits.
# Once a month this writes the date to a small file, so server-watch keeps running.
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u '+%Y-%m-%d' > .last-alive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-alive
          git commit -m "keepalive $(cat .last-alive)" || exit 0
          git push
